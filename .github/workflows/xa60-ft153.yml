name: FT XA60 build 153 (experimental)

on:
  push:
    branches: [openivi/xa60-iccoa-build153]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ft-xa60-build153
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, openivi-ci]
    timeout-minutes: 70
    env:
      GRADLE_USER_HOME: /srv/openivi-ci/.gradle-ft-xa60
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify existing non-root OpenIVI runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "openivi-ci"
          test "$(id -u)" != "0"
          if sudo -n true >/dev/null 2>&1; then echo "Unexpected passwordless sudo" >&2; exit 1; fi
          df -h /
          free -h

      - name: Checkout exact FT fork branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Pin and audit the source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq '.int32(5, 2)' app/src/main/java/app/ft/iccoa/IccoaAudioPlayerState.kt
          grep -Fq 'preserveAspect' app/src/main/java/app/ft/iccoa/IccoaVideoPlan.kt
          grep -Fq 'versionCode = 153' app/build.gradle.kts
          grep -Fq 'signingConfigs.getByName("debug")' app/build.gradle.kts
          echo "FT_SOURCE_SHA=$GITHUB_SHA"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Bounded Gradle memory configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=false
          org.gradle.configuration-cache=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF

      - name: Test and compile signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 testDebugUnitTest assembleDebug --stacktrace

      - name: Validate APK and stage copy locally
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/ft-apksigner.txt"
          "$bt/aapt" dump badging "$apk" | grep -m1 "^package: name='app.ft' versionCode='153'"
          sha256sum "$apk" | tee "$RUNNER_TEMP/ft-sha256.txt"
          dest="/srv/openivi-ci/artifact-spool/ft-xa60/$GITHUB_SHA/$GITHUB_RUN_ID"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a "$apk" "$dest/"
          cp -a "$RUNNER_TEMP/ft-apksigner.txt" "$dest/"
          cp -a "$RUNNER_TEMP/ft-sha256.txt" "$dest/"
          echo "FT_XA60_SPOOL=$dest"
          echo "FT_APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Publish experimental prerelease APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          apk = pathlib.Path(os.environ["FT_APK_PATH"])
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          tag = "xa60-ft153-" + sha[:12]
          base = "https://api.github.com/repos/" + repo
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def github(url, method="GET", obj=None, data=None, content_type=None):
              h = dict(headers)
              if content_type: h["Content-Type"] = content_type
              if obj is not None:
                  data = json.dumps(obj).encode()
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET": return None
                  raise
          release = github(base + "/releases/tags/" + tag)
          if release is None:
              release = github(base + "/releases", method="POST", obj={
                  "tag_name": tag, "target_commitish": sha,
                  "name": "FT 153 XA60 experimental " + sha[:12],
                  "body": "Experimental debug-signed FT, not validated on Toyota XA60 HU. APK SHA-256: " + checksum + ". Installing over the upstream release requires removing the differently signed original app first.",
                  "prerelease": True, "draft": False
              })
          existing = {item["name"]:item for item in release.get("assets", [])}
          filename = "ft-153-xa60-" + sha[:12] + ".apk"
          if filename in existing:
              asset = existing[filename]
              if asset["size"] != apk.stat().st_size or asset.get("digest") not in ("sha256:" + checksum, None):
                  raise RuntimeError("Existing release APK conflicts with this commit")
          else:
              uploads = "https://uploads.github.com/repos/" + repo + "/releases/" + str(release["id"]) + "/assets?name=" + urllib.parse.quote(filename)
              asset = github(uploads, method="POST", data=apk.read_bytes(), content_type="application/vnd.android.package-archive")
          if asset.get("state") != "uploaded":
              raise RuntimeError("APK upload not terminal: " + str(asset.get("state")))
          print("FT_APK_DOWNLOAD=" + asset["browser_download_url"])
          print("FT_APK_SHA256=" + checksum)
          print("FT_RELEASE=" + release["html_url"])
          PY
